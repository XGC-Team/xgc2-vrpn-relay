schema: xgc2.product.v1
id: xgc2-vrpn-relay
name: XGC2 VRPN Relay
version: 0.1.0-9
kind: ros1-apt
summary: Shared ROS1 VRPN relay plus Experiment XYZ localization projection and bounded vision_pose output.
groups:
- ros1
- communication
- mocap
ros:
  distro: melodic,noetic
  workspace: catkin
  packages:
  - xgc2_vrpn_relay
apt:
  distribution: bionic,focal,jammy,noble
  install:
  - xgc2-vrpn-relay
  packages:
  - xgc2-vrpn-relay
  package_architectures:
    xgc2-vrpn-relay:
    - amd64
    - arm64
  depends:
  - python3
  recommends:
  - ros-melodic-vrpn-client-ros
  - ros-noetic-vrpn-client-ros
  - ros-melodic-geometry-msgs
  - ros-noetic-geometry-msgs
  - ros-melodic-rospy
  - ros-noetic-rospy
usage:
  install: 'sudo apt update

    sudo apt install xgc2-vrpn-relay

    '
  smoke_test: 'test -x /opt/ros/noetic/lib/xgc2_vrpn_relay/experiment_projection

    test -x /opt/ros/noetic/lib/xgc2_vrpn_relay/vrpn_relay

    test -f /opt/ros/noetic/share/xgc2_vrpn_relay/launch/mocap.launch

    '
  notes: 'Robots must not copy vrpn_relay. Experiment projection takes
    source_root, mocap_rigid_body, robot_namespace, and publish_vision,
    derives the only input/output topics, and applies explicit XYZ
    translation plus a bounded vision rate. It does not align, interpolate,
    repeat, fit clocks, switch sources, or accept explicit pose_in/out topics.

    '
ownership:
  paths:
  - /opt/ros/melodic/share/xgc2_vrpn_relay
  - /opt/ros/melodic/lib/xgc2_vrpn_relay
  - /opt/ros/noetic/share/xgc2_vrpn_relay
  - /opt/ros/noetic/lib/xgc2_vrpn_relay
release:
  repository: XGC-Team/xgc2-vrpn-relay
  ref: main
  workflow: release.yml
  ci_workflow: ci.yml
  apt_versions:
    bionic: 0.1.0-9
    focal: 0.1.0-9
    jammy: 0.1.0-9
    noble: 0.1.0-9
